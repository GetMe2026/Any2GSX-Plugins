name: Build PMDG 737 native plugin

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pmdg737-native-plugin
    paths:
      - 'Pmdg737Interface/**'
      - '.github/workflows/build-pmdg737.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Any2GSX plugins
        uses: actions/checkout@v4

      - name: Checkout CFIT sources
        uses: actions/checkout@v4
        with:
          repository: Fragtality/CFIT
          ref: master
          path: _deps/CFIT

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare CFIT projects for CI packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE '_deps\CFIT'

          $projects = @(
            'AppLogger\AppLogger.csproj',
            'AppTools\AppTools.csproj',
            'SimConnectLib\SimConnectLib.csproj',
            'AppFramework\AppFramework.csproj'
          )

          foreach ($relative in $projects) {
            $path = Join-Path $root $relative
            $content = Get-Content $path -Raw

            $content = [regex]::Replace(
              $content,
              '(?s)\s*<Target Name="PreBuild".*?</Target>',
              ''
            )
            $content = [regex]::Replace(
              $content,
              '(?s)\s*<Target Name="PostBuild".*?</Target>',
              ''
            )

            $content = $content.Replace(
              '<TargetFrameworks>net48-windows10.0.17763.0;net10.0-windows10.0.17763.0</TargetFrameworks>',
              '<TargetFramework>net10.0-windows10.0.17763.0</TargetFramework>'
            )

            Set-Content -Path $path -Value $content -Encoding utf8
          }

      - name: Create CI NuGet configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $feed = Join-Path $env:GITHUB_WORKSPACE '_deps\packages'
          $config = Join-Path $env:GITHUB_WORKSPACE '_deps\NuGet.config'

          New-Item -ItemType Directory -Force -Path $feed | Out-Null

          $xml = @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local-cfit" value="$feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          "@

          $xml | Set-Content -Path $config -Encoding utf8

      - name: Build local CFIT NuGet feed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root = Join-Path $env:GITHUB_WORKSPACE '_deps\CFIT'
          $feed = Join-Path $env:GITHUB_WORKSPACE '_deps\packages'
          $config = Join-Path $env:GITHUB_WORKSPACE '_deps\NuGet.config'

          $packages = @(
            @{ Project = 'AppLogger\AppLogger.csproj'; Version = '2026.255.17.3105' },
            @{ Project = 'AppTools\AppTools.csproj'; Version = '2026.255.17.3122' },
            @{ Project = 'SimConnectLib\SimConnectLib.csproj'; Version = '2026.255.17.3143' },
            @{ Project = 'AppFramework\AppFramework.csproj'; Version = '2026.255.17.3154' }
          )

          foreach ($package in $packages) {
            $project = Join-Path $root $package.Project

            dotnet restore "$project" --configfile "$config"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            dotnet pack "$project" `
              --configuration Release `
              --no-restore `
              --output "$feed" `
              -p:Version=$($package.Version)

            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Restore PMDG 737 plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Join-Path $env:GITHUB_WORKSPACE '_deps\NuGet.config'

          dotnet restore "Pmdg737Interface/Pmdg737Interface.csproj" --configfile "$config"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build PMDG 737 plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet build "Pmdg737Interface/Pmdg737Interface.csproj" `
            --configuration Release `
            --no-restore `
            -p:SkipPluginPackaging=true

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create installable beta package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $output = Join-Path $env:GITHUB_WORKSPACE 'Pmdg737Interface\bin\Release\net10.0-windows10.0.17763.0\win-x64'
          $stage = Join-Path $env:GITHUB_WORKSPACE '_package\PMDG.B737'
          $zip = Join-Path $env:GITHUB_WORKSPACE '_package\PMDG.B737-v0.2.0-beta.zip'

          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item (Join-Path $output 'Pmdg737Interface.dll') (Join-Path $stage 'Pmdg737Interface.dll')
          Copy-Item 'Pmdg737Interface\manifest.json' (Join-Path $stage 'manifest.json')
          Copy-Item 'Pmdg737Interface\Channel\PMDG.737.json' (Join-Path $stage 'PMDG.737.json')

          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force

      - name: Upload validation build
        uses: actions/upload-artifact@v4
        with:
          name: PMDG-B737-native-v0.2.0-beta
          if-no-files-found: error
          path: |
            _package/PMDG.B737-v0.2.0-beta.zip
            Pmdg737Interface/Profiles/PMDG.737.Native-Profile-IMPORT.json
            Pmdg737Interface/Profiles/PMDG.738.Ryanair.Native-Profile-IMPORT.json
            Pmdg737Interface/README_TESTING.md
            Pmdg737Interface/VALIDATION.txt
